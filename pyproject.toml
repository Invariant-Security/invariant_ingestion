[project]
name = "invariant_ingestion"
version = "0.1.0"
description = "Fetches, parses and normalizes CIS benchmark PDFs into structured controls. No Postgres access -- see invariant_api for persistence."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pypdf",
    "playwright",
]
# ponytail: invariant_contracts is NOT a dependency here either -- api.py
# defines its own small request/response models (RawArtifactResponse,
# ExtractedRecommendationResponse, ControlResponse) rather than importing
# the shared ones, matching invariant_assessment's same choice. Revisit if
# duplication between these and invariant_contracts' models becomes a real
# maintenance cost.

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx2"]

[tool.pytest.ini_options]
markers = [
    "integration: hits a real external service (cisecurity.org) instead of using mocks/fixtures",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invariant_ingestion"]
