# Net-new capacidade de CI, ver o mesmo comentário em invariant_api's
# publish-image.yml -- publica a imagem que docker-compose.appliance.yml
# referencia via `image:`.
#
# Dois modos:
#  - push de tag v*: tags da versão e `latest` (comportamento original).
#  - workflow_run do `ci` verde em dev/main: uma imagem por commit,
#    <branch>-<sha>, para o k8s puxar por digest. Nunca `latest`.
# Atenção: o GitHub usa a versão DESTE arquivo na branch padrão (main) para
# workflow_run; esse gatilho só vale depois de chegar ao main.
name: publish-image

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [dev, main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        env:
          IMG: ghcr.io/invariant-security/invariant-ingestion
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo "list<<EOT"
            if [ "$EVENT" = workflow_run ]; then
              echo "$IMG:$HEAD_BRANCH-$HEAD_SHA"
            else
              echo "$IMG:$REF_NAME"
              echo "$IMG:latest"
            fi
            echo "EOT"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
      - name: Resumo
        run: echo "ghcr.io/invariant-security/invariant-ingestion@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
