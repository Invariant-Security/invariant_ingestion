# Pure Python -- sem Docker/Postgres. `-m "not integration"` deliberadamente
# exclui os testes que batem em cisecurity.org de verdade (lentos e
# suscetíveis a rate-limiting -- ver source.py's próprio comentário sobre
# isso); rodam só sob demanda (`pytest -m integration`), não bloqueiam PR.
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Mesmo lock da imagem (Dockerfile); só as ferramentas de teste
      # (extra `dev`) continuam sem pin.
      - run: pip install --require-hashes --no-deps -r requirements.lock
      - run: pip install --no-deps -e . && pip install pytest pytest-cov pytest-timeout httpx2
      - run: pytest tests/ -q -m "not integration"
